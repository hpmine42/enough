<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>enough. — Login</title>

<style>
:root {
    --bg: #F2F1EC;
    --text: #252522;
    --muted: #77766F;
    --border: #D6D4CC;
    --button: #292925;
    --button-text: #F2F1EC;
}

:root.dark {
    --bg: #191917;
    --text: #E7E6DF;
    --muted: #929189;
    --border: #33332F;
    --button: #E4E3DC;
    --button-text: #191917;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        background 0.25s ease,
        color 0.25s ease;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100dvh;

    padding:
        calc(env(safe-area-inset-top) + 40px)
        28px
        calc(env(safe-area-inset-bottom) + 32px);

    display: flex;
    flex-direction: column;
}

.brand {
    margin-top: 18vh;
    margin-bottom: 48px;
}

.brand h1 {
    margin: 0;

    font-size: 18px;
    font-weight: 600;

    letter-spacing: -0.02em;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input {
    width: 100%;
    height: 54px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: transparent;
    color: var(--text);

    padding: 0 16px;

    font-size: 16px;
    outline: none;

    transition:
        border-color 0.25s ease,
        color 0.25s ease;
}

.input::placeholder {
    color: var(--muted);
}

.button {
    width: 100%;
    height: 54px;

    margin-top: 8px;

    border: 0;
    border-radius: 13px;

    background: var(--button);
    color: var(--button-text);

    font-size: 16px;
    font-weight: 500;
}

.register {
    margin-top: 18px;

    text-align: center;

    font-size: 14px;
    color: var(--muted);
}

.register strong {
    color: var(--text);
    font-weight: 500;
}

.theme {
    position: fixed;

    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 20px);

    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: transparent;
    color: var(--muted);

    font-size: 15px;

    cursor: pointer;

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease;
}

.theme:active {
    transform: scale(0.94);
}

@media (min-width: 600px) {
    .app {
        min-height: 760px;
    }
}
</style>
</head>

<body>

<main class="app">

    <section class="brand">
        <h1>ENOUGH.</h1>
    </section>

    <section class="form">

        <input
            class="input"
            type="email"
            placeholder="E-Mail"
        >

        <input
            class="input"
            type="password"
            placeholder="Passwort"
        >

        <button class="button">
            Anmelden
        </button>

    </section>

    <div class="register">
        Noch kein Konto?
        <strong>Registrieren</strong>
    </div>

</main>

<button
    class="theme"
    id="themeToggle"
    aria-label="Darstellung wechseln"
>
    ◐
</button>

<script>
const root = document.documentElement;
const toggle = document.getElementById("themeToggle");

function applyTheme(theme) {
    root.classList.toggle("dark", theme === "dark");
    localStorage.setItem("enough-theme", theme);
}

const savedTheme = localStorage.getItem("enough-theme");

if (savedTheme) {
    applyTheme(savedTheme);
} else {
    applyTheme(
        window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
    );
}

toggle.addEventListener("click", () => {
    const isDark = root.classList.contains("dark");
    applyTheme(isDark ? "light" : "dark");
});
</script>

</body>
</html>
