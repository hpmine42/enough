# enough. — continuous integration (pull-request gate)
#
# WHY THIS FILE EXISTS
#   Before this workflow, the only automation was `deploy.yml`, which triggers on
#   `push` to `main` and runs just four of the project's test entry points
#   (`test:crypto`, `test:crypto:engine`, `smoke`, `test:crypto:prekeys`).
#   Pull requests therefore merged with no checks at all, and 485 of the 773
#   `node --test` cases — plus `test:rls`, the only suite that applies the whole
#   migration chain 0001→0014 and asserts authorization — never ran
#   automatically (audit C3 / F-03).
#
# WHAT IT RUNS
#   * `verify:signal-wasm`   supply-chain hash assertion (fail fast, no network)
#   * `build`                `tsc --noEmit` + production bundle
#   * EVERY `test:*` script in package.json, discovered at runtime (see below)
#   * `smoke`                jsdom render of the production bundle
#
#   The test list is DERIVED FROM package.json instead of being copied here on
#   purpose: a newly added `test:<name>` script is picked up automatically, so
#   the gate cannot silently drift away from the suite inventory again. If a new
#   suite needs something this workflow does not provide (secrets, network,
#   services), it fails loudly here rather than being quietly skipped.
#
# SECURITY / UNTRUSTED CODE
#   * Trigger is `pull_request`, NOT `pull_request_target`. Fork PRs therefore
#     run with the read-only default `GITHUB_TOKEN` and GitHub Actions does not
#     pass repository secrets to them at all.
#   * This workflow references NO secrets and needs none: every suite runs
#     against stubs or against the embedded PostgreSQL started by
#     `scripts/run-*.mjs`. There is consequently nothing to leak into a log, and
#     no privileged credential is ever within reach of untrusted PR code.
#   * `permissions:` is pinned to the minimum (`contents: read`).
#
# REPRODUCIBILITY
#   * Actions are pinned to full commit SHAs (version in the trailing comment);
#     no `@latest`, no moving tag.
#   * Dependencies install with `npm ci` from `package-lock.json`.
#   * The Node major matches `deploy.yml` so the gate and the release path run
#     the same toolchain.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # F5: byte-exact SHA-256 verification of @getmaapp/signal-wasm@0.6.6
      # against the audited manifest (docs/e2ee-f5-supply-chain.md). Pure
      # filesystem check — it runs first because everything below links against
      # these artifacts.
      - name: Verify signal-wasm artifacts (F5)
        run: npm run verify:signal-wasm

      - name: Build (typecheck + production bundle)
        run: npm run build

      # Runs every `test:*` script from package.json, including the two live
      # PostgreSQL harnesses (`test:crypto:prekeys`, `test:rls`). All suites run
      # even if an earlier one fails, so a single log shows the complete
      # picture; the step then fails if any suite failed.
      - name: Run all test suites
        run: |
          set -uo pipefail
          suites="$(node -e '
            const s = require("./package.json").scripts;
            process.stdout.write(Object.keys(s).filter((k) => k.startsWith("test:")).sort().join("\n"));
          ')"
          echo "Discovered test suites:"
          printf '  - %s\n' $suites
          echo
          failed=""
          for suite in $suites; do
            echo "──────── $suite ────────"
            if npm run --silent "$suite"; then
              echo "✔ $suite"
            else
              echo "✘ $suite FAILED"
              failed="$failed $suite"
            fi
            echo
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing test suites:$failed"
            exit 1
          fi
          echo "All discovered test suites passed."

      # Renders the production bundle in jsdom with a stubbed Supabase API and
      # the REAL Signal engine. Builds into an isolated `.smoke-dist/`, so it
      # cannot overwrite the `dist/` produced above.
      - name: Smoke test
        run: npm run smoke
