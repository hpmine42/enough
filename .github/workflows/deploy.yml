name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # F5: supply-chain hash assertion for @getmaapp/signal-wasm@0.6.6.
      # Byte-exact SHA-256 verification of the installed WASM/crypto artifacts
      # against the audited manifest (docs/e2ee-f5-supply-chain.md). Pure
      # filesystem check: no secrets, no network beyond the npm ci above.
      # Any mismatch fails the workflow before build, tests and deploy.
      - name: Verify signal-wasm artifacts (F5)
        run: npm run verify:signal-wasm

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: /enough/

      - name: Test crypto
        run: npm run test:crypto
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: /enough/

      - name: Test crypto engine
        run: npm run test:crypto:engine
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: /enough/

      - name: Smoke test
        run: npm run smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: /enough/

      # F3: real PostgreSQL RPC/RLS tests (embedded Postgres, no cloud secrets).
      # Runs after the existing F4 gates and before deploy so a failure blocks Pages.
      - name: Test crypto prekeys (live Postgres RPC/RLS)
        run: npm run test:crypto:prekeys
          
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
